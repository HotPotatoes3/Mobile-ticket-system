<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swap Shop Tickets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9F%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #fbf8f4;
      --card: #ffffff;
      --ink: #1d1b19;
      --muted: #6d6863;
      --line: #e6e0d9;
      --red: #d3262b;
      --red-ink: #ffffff;
      --green: #1f8a4c;
      --green-ink: #ffffff;
      --soft-red: #fde9e8;
      --soft-green: #e4f4ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171514;
        --card: #221f1d;
        --ink: #f3efea;
        --muted: #a39d96;
        --line: #36312d;
        --red: #ef4a4f;
        --green: #34b36b;
        --soft-red: #3a1f1f;
        --soft-green: #1b3326;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 16px 48px;
      max-width: 520px;
      margin: 0 auto;
      -webkit-text-size-adjust: 100%;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0; color: var(--red); letter-spacing: -0.3px; }
    h1 small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
    input {
      width: 100%; font-size: 17px; padding: 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    }
    input.code { text-transform: uppercase; letter-spacing: 4px; font-weight: 700; text-align: center; font-size: 22px; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 13px 16px;
      cursor: pointer; background: var(--line); color: var(--ink); min-height: 48px;
    }
    button:disabled { opacity: 0.5; }
    button.primary { background: var(--red); color: var(--red-ink); }
    button.go { background: var(--green); color: var(--green-ink); }
    button.link { background: none; color: var(--muted); padding: 8px; min-height: 0; text-decoration: underline; font-weight: 500; }
    button.small { padding: 6px 10px; min-height: 0; font-size: 13px; border-radius: 8px; }
    .full { width: 100%; margin-top: 12px; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs button { flex: 1; background: var(--card); border: 1px solid var(--line); }
    .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .tabs.sub { margin-bottom: 8px; }
    .tabs.sub button { min-height: 0; padding: 7px 10px; font-size: 14px; }
    .tabs.sub button.on { background: var(--soft-green); color: var(--green); border-color: var(--green); }
    .balance { text-align: center; padding: 8px 0; }
    .balance .num { font-size: 76px; font-weight: 800; line-height: 1; color: var(--red); font-variant-numeric: tabular-nums; }
    .balance .lbl { color: var(--muted); }
    .who { text-align: center; font-size: 20px; font-weight: 700; }
    .codebig { text-align: center; font-size: 30px; font-weight: 800; letter-spacing: 6px; margin: 6px 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .center { text-align: center; }
    .qr { display: flex; justify-content: center; padding: 24px; background: #fff; border-radius: 12px; width: fit-content; margin: 8px auto; }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 8px 0 4px; }
    .stepper button { width: 56px; height: 56px; font-size: 28px; border-radius: 50%; padding: 0; }
    .stepper .n { font-size: 44px; font-weight: 800; min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
    ul.list { list-style: none; margin: 0; padding: 0; }
    ul.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    ul.list li:first-child { border-top: 0; }
    ul.list .grow { flex: 1; min-width: 0; }
    ul.list .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chg { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
    .chg.plus { color: var(--green); }
    .chg.minus { color: var(--red); }
    .struck .title, .struck .chg, .struck .items-given { text-decoration: line-through; opacity: 0.55; }
    .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--line); color: var(--muted); }
    .clickable { cursor: pointer; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: var(--bg); border-radius: 12px; padding: 12px; text-align: center; }
    .stat b { display: block; font-size: 28px; }
    .notice { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
    .notice.err { background: var(--soft-red); color: var(--red); }
    .notice.ok { background: var(--soft-green); color: var(--green); }
    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
      background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px;
      font-weight: 600; transition: transform 0.25s, visibility 0.25s; max-width: calc(100% - 32px); z-index: 10;
      visibility: hidden;
    }
    #toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
    #toast.err { background: var(--red); color: #fff; }
    #staffBtn { white-space: nowrap; flex-shrink: 0; }
    .qr img, .qr canvas { image-rendering: pixelated; max-width: 100%; height: auto; }
    .items { counter-reset: item; }
    .item-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
    .item-row:first-child { border-top: 0; }
    .item-row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .item-row .item-desc { font-size: 15px; padding: 9px 12px; }
    .item-num { flex: none; width: 28px; height: 28px; margin-top: 10px; border-radius: 50%; background: var(--soft-green); color: var(--green); font-weight: 800; font-size: 14px; display: grid; place-items: center; }
    .item-num::before { counter-increment: item; content: counter(item); }
    .item-row .remove { flex: none; margin-top: 6px; min-width: 40px; min-height: 40px; font-size: 20px; line-height: 1; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
    .chip { min-height: 36px; padding: 6px 12px; border-radius: 99px; font-size: 14px; background: var(--bg); border: 1px solid var(--line); }
    ul.items-given { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
    ul.items-given li { padding: 1px 0; border: 0; display: list-item; }
    ul.items-given .muted { font-size: 13px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Swap Shop<small>Digital tickets</small></h1>
    <button id="staffBtn" class="link small hidden"></button>
  </header>
  <div id="app"><p class="muted center">Loading…</p></div>
  <div id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const app = document.getElementById('app');
const state = { mode: 'give', pin: '', staff: '', tab: 'find', code: '' };

const store = {
  get(k) { try { return localStorage.getItem('swapshop.' + k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { v ? localStorage.setItem('swapshop.' + k, v) : localStorage.removeItem('swapshop.' + k); } catch (e) {} }
};

const CONFIG = Object.assign({ eventName: 'Swap Shop', maxPerEntry: 50 }, window.SWAP_SHOP);

/**
 * Calls a function in the Apps Script backend (Code.gs doPost).
 * text/plain avoids a CORS preflight, which Apps Script can't answer. No cookies
 * are sent, so it works no matter how many Google accounts the browser has.
 */
async function call(fn, ...args) {
  if (!CONFIG.apiUrl) throw new Error('apiUrl is not set in config.js. See the README.');
  let res;
  try {
    res = await fetch(CONFIG.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args }),
    });
  } catch (e) {
    throw new Error('Can\'t reach the ticket server. Check your internet connection and try again.');
  }
  let data;
  try { data = await res.json(); } catch (e) { throw new Error('The ticket server sent an unexpected reply. Try again.'); }
  if (!data.ok) throw new Error(data.error || 'Something went wrong.');
  return data.result;
}

/** Donations send item lists, which older copies of Code.gs would silently ignore. */
const NEEDS_API_VERSION = 2;
let serverCheck = null;
function ensureServerUpToDate() {
  serverCheck = serverCheck || call('getConfig').then((cfg) => {
    if (!(cfg.apiVersion >= NEEDS_API_VERSION)) {
      throw new Error('The ticket server (Code.gs) is out of date. Ask an organizer to update it — see the README.');
    }
  });
  serverCheck.catch(() => { serverCheck = null; });
  return serverCheck;
}

function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^Exception:\s*/, ''); }

/** Tiny element builder: h('div', {class: 'x', onclick: fn}, 'text', child, ...). Text is never parsed as HTML. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function render(...nodes) { app.replaceChildren(...nodes.filter((n) => n != null)); window.scrollTo(0, 0); }

let toastTimer;
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = isErr ? 'err' : ''; }, isErr ? 4000 : 2200);
}

/** Disables a button while an async action runs, and shows errors as a toast. */
async function busy(btn, fn) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Working…';
  try { return await fn(); }
  catch (e) { toast(errMsg(e), true); }
  finally { btn.disabled = false; btn.textContent = label; }
}

function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function walletUrl(code) { return location.origin + location.pathname + '?m=' + encodeURIComponent(code); }
function isStaff() { return !!state.pin; }

function qrBox(code) {
  const box = h('div', { class: 'qr' });
  try {
    // Low error correction keeps the code coarse, and a whole number of pixels
    // per square keeps the squares even — both make phone cameras read it faster.
    const opts = { text: walletUrl(code), width: 246, height: 246, correctLevel: QRCode.CorrectLevel.L };
    const qr = new QRCode(box, opts);
    const modules = qr._oQRCode && qr._oQRCode.getModuleCount();
    if (modules && 246 % modules) {
      box.replaceChildren();
      const size = modules * Math.max(5, Math.round(246 / modules));
      new QRCode(box, Object.assign(opts, { width: size, height: size }));
    }
  } catch (e) {
    box.append(h('span', { class: 'muted' }, 'QR unavailable — use the code below.'));
  }
  return box;
}

function changeCell(e) {
  return h('span', { class: 'chg ' + (e.change > 0 ? 'plus' : 'minus') }, (e.change > 0 ? '+' : '') + e.change);
}

// ---------------------------------------------------------------------------
// Navigation
// ---------------------------------------------------------------------------
function go(params) {
  const qs = new URLSearchParams(params).toString();
  history.pushState(null, '', location.pathname + (qs ? '?' + qs : ''));
  route(params);
}

function route(params) {
  state.code = (params.m || '').toUpperCase();
  updateHeader();
  if (state.code) return isStaff() ? showStaffMember(state.code, params.fresh === '1' ? { showQr: true } : null) : showWallet(state.code);
  if (params.staff === '1' && !isStaff()) return showLogin();
  return isStaff() ? showStaffHome() : showHome();
}

function updateHeader() {
  const btn = document.getElementById('staffBtn');
  btn.classList.remove('hidden');
  if (isStaff()) {
    btn.textContent = state.staff + ' · Log out';
    btn.onclick = () => { state.pin = ''; store.set('pin', ''); toast('Logged out'); go({}); };
  } else {
    btn.textContent = 'Volunteer login';
    btn.onclick = () => go({ staff: '1' });
  }
}

// ---------------------------------------------------------------------------
// Public views
// ---------------------------------------------------------------------------
function showHome() {
  const input = h('input', { class: 'code', id: 'codeInput', placeholder: 'ABC12', maxlength: '8', autocomplete: 'off', autocapitalize: 'characters' });
  const open = () => { const c = input.value.trim(); if (c) go({ m: c.toUpperCase() }); };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
  render(
    h('div', { class: 'card' },
      h('h2', {}, 'Check your tickets'),
      h('p', { class: 'muted' }, 'Enter the code a volunteer gave you when you dropped off donations.'),
      input,
      h('button', { class: 'primary full', onclick: open }, 'Show my tickets')
    ),
    h('div', { class: 'card' },
      h('h2', {}, 'How it works'),
      h('ul', { class: 'muted' },
        h('li', {}, 'Drop off clean donations in good condition — 1 item = 1 ticket.'),
        h('li', {}, 'Your tickets live on your phone. Bookmark or screenshot your ticket page.'),
        h('li', {}, 'At the shop, show your QR code to spend tickets on goods.')
      )
    )
  );
}

async function showWallet(code) {
  render(h('p', { class: 'muted center' }, 'Loading tickets…'));
  try {
    const w = await call('getWallet', code);
    render(
      h('div', { class: 'card' },
        h('div', { class: 'who' }, w.name),
        h('div', { class: 'balance' },
          h('div', { class: 'num', id: 'balance' }, w.balance),
          h('div', { class: 'lbl' }, w.balance === 1 ? 'ticket' : 'tickets')
        ),
        qrBox(w.code),
        h('div', { class: 'codebig' }, w.code),
        h('p', { class: 'muted center' }, 'Show this screen at the Swap Shop. Bookmark or screenshot it so you don\'t lose it!')
      ),
      historyCard(w.history, false),
      h('button', { class: 'link', onclick: () => showWallet(code) }, 'Refresh')
    );
  } catch (e) {
    render(
      h('div', { class: 'notice err' }, errMsg(e)),
      h('button', { class: 'full', onclick: () => go({}) }, 'Back')
    );
  }
}

function historyCard(history, staffMode, onUndo) {
  const items = history.map((e) => {
    const undoBtn = staffMode && !e.undone && e.type !== 'UNDO'
      ? h('button', { class: 'small', onclick: (ev) => onUndo(e, ev.currentTarget) }, 'Undo')
      : null;
    const items = e.items || [];
    return h('li', { class: e.undone ? 'struck' : '' },
      h('div', { class: 'grow' },
        h('div', { class: 'title' }, items.length ? 'Donated ' + plural(items.length, 'item') : (e.note || e.type)),
        items.length ? h('ul', { class: 'items-given' }, items.map((it) =>
          h('li', {}, it.name, it.description ? h('span', { class: 'muted' }, ' — ' + it.description) : null)
        )) : null,
        h('div', { class: 'muted' }, fmtTime(e.ts), staffMode && e.staff ? ' · ' + e.staff : '', e.undone ? ' · undone' : '')
      ),
      changeCell(e),
      undoBtn
    );
  });
  return h('div', { class: 'card' },
    h('h2', {}, 'History'),
    items.length ? h('ul', { class: 'list' }, items) : h('p', { class: 'muted' }, 'No activity yet.')
  );
}

// ---------------------------------------------------------------------------
// Staff views
// ---------------------------------------------------------------------------
function showLogin() {
  const name = h('input', { id: 'staffName', placeholder: 'e.g. Maya', value: store.get('staff'), autocomplete: 'name' });
  const pin = h('input', { id: 'staffPin', type: 'password', placeholder: 'Ask an organizer', autocomplete: 'current-password' });
  const btn = h('button', { class: 'primary full' }, 'Log in');
  const submit = () => busy(btn, async () => {
    if (!name.value.trim()) throw new Error('Enter your name so entries can be traced.');
    await call('staffLogin', pin.value);
    state.pin = pin.value;
    state.staff = name.value.trim();
    store.set('pin', state.pin);
    store.set('staff', state.staff);
    toast('Welcome, ' + state.staff + '!');
    go({});
  });
  btn.addEventListener('click', submit);
  pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  render(
    h('div', { class: 'card' },
      h('h2', {}, 'Volunteer login'),
      h('label', { for: 'staffName' }, 'Your name'), name,
      h('label', { for: 'staffPin' }, 'Staff PIN'), pin,
      btn
    ),
    h('button', { class: 'link', onclick: () => go({}) }, 'Back')
  );
}

function showStaffHome() {
  const tabs = [['find', 'Find'], ['new', 'New donor'], ['stats', 'Stats']];
  const body = h('div', {});
  const tabBar = h('div', { class: 'tabs' }, tabs.map(([id, label]) =>
    h('button', { class: state.tab === id ? 'on' : '', onclick: () => { state.tab = id; showStaffHome(); } }, label)
  ));
  render(tabBar, body);
  if (state.tab === 'find') findTab(body);
  else if (state.tab === 'new') newDonorTab(body);
  else statsTab(body);
}

function findTab(body) {
  const input = h('input', { id: 'search', placeholder: 'Code, name, or phone', autocomplete: 'off' });
  const results = h('ul', { class: 'list' });
  let timer, seq = 0;
  const search = async () => {
    const mySeq = ++seq;
    try {
      const rows = await call('searchMembers', state.pin, input.value);
      if (mySeq !== seq) return;
      results.replaceChildren(...(rows.length ? rows.map((r) =>
        h('li', { class: 'clickable', onclick: () => go({ m: r.code }) },
          h('div', { class: 'grow' },
            h('div', { class: 'title' }, r.name),
            h('div', { class: 'muted' }, h('span', { class: 'pill' }, r.code), r.contact ? ' ' + r.contact : '')
          ),
          h('span', { class: 'chg' }, plural(r.balance, 'ticket'))
        )) : [h('li', { class: 'muted' }, 'No matches. Add them under "New donor".')]));
    } catch (e) { toast(errMsg(e), true); }
  };
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 300); });
  body.append(
    h('div', { class: 'card' },
      h('h2', {}, 'Find a person'),
      input,
      h('p', { class: 'muted' }, 'Tip: ticket holders can also show their QR — scan it with your phone camera.'),
      results
    )
  );
  search();
  input.focus();
}

function stepper(initial, min) {
  let n = initial;
  const num = h('span', { class: 'n' }, n);
  const listeners = [];
  const set = (v) => {
    n = Math.max(min, Math.min(CONFIG.maxPerEntry, v));
    num.textContent = n;
    listeners.forEach((fn) => fn(n));
  };
  const el = h('div', { class: 'stepper' },
    h('button', { 'aria-label': 'Fewer', onclick: () => set(n - 1) }, '−'),
    num,
    h('button', { 'aria-label': 'More', onclick: () => set(n + 1) }, '+')
  );
  return { el, get: () => n, set, onChange: (fn) => listeners.push(fn) };
}

const ITEM_CHIPS = ['Shirt', 'Pants', 'Jacket', 'Sweater', 'Dress', 'Shoes', 'Bag', 'Jewelry', 'Accessory'];

/** List of donated items: a name and optional description each. 1 item = 1 ticket. */
function itemEditor() {
  const list = h('div', { class: 'items' });
  const listeners = [];
  const rows = () => [...list.children].map((row) => ({
    name: row.querySelector('.item-name').value.trim(),
    description: row.querySelector('.item-desc').value.trim(),
  }));
  const changed = () => { const n = api.count(); listeners.forEach((fn) => fn(n)); };

  function addRow(name) {
    const nameIn = h('input', { class: 'item-name', placeholder: 'Item (e.g. Jacket)', autocomplete: 'off', maxlength: '60', 'aria-label': 'Item name' });
    const descIn = h('input', { class: 'item-desc', placeholder: 'Description (optional)', autocomplete: 'off', maxlength: '200', 'aria-label': 'Item description' });
    nameIn.value = name || '';
    const row = h('div', { class: 'item-row' },
      h('span', { class: 'item-num', 'aria-hidden': 'true' }),
      h('div', { class: 'grow' }, nameIn, descIn),
      h('button', { class: 'small remove', 'aria-label': 'Remove item', onclick: () => {
        row.remove();
        if (!list.children.length) addRow();
        changed();
      } }, '×')
    );
    nameIn.addEventListener('input', changed);
    descIn.addEventListener('input', changed);
    list.append(row);
    changed();
    return nameIn;
  }

  const quickAdd = (label) => {
    const empty = [...list.querySelectorAll('.item-name')].find((i) => !i.value.trim());
    if (empty) empty.value = label;
    else addRow(label);
    changed();
  };

  const api = {
    el: h('div', {},
      h('div', { class: 'chips' }, ITEM_CHIPS.map((c) => h('button', { class: 'chip', type: 'button', onclick: () => quickAdd(c) }, '+ ' + c))),
      list,
      h('button', { class: 'full', type: 'button', id: 'addItemBtn', onclick: () => addRow().focus() }, '+ Add another item')
    ),
    /** Filled-in items; throws if a row has a description but no name. */
    items() {
      const filled = rows().filter((r) => r.name || r.description);
      if (filled.some((r) => !r.name)) throw new Error('Every item needs a name (e.g. "Jacket").');
      return filled;
    },
    count: () => rows().filter((r) => r.name).length,
    onChange: (fn) => listeners.push(fn),
  };
  addRow();
  return api;
}

/**
 * Donation form with two styles: "Quick count" (just how many items, the default)
 * or "List items" (a name + optional description per item). Each phone remembers
 * the last style used.
 */
function donationInput(min) {
  const quick = stepper(Math.max(min, 1), min);
  const list = itemEditor();
  const listeners = [];
  const panels = {
    quick: h('div', {}, h('p', { class: 'muted center' }, 'How many items did they drop off?'), quick.el),
    list: h('div', {}, h('p', { class: 'muted' }, 'Tap a button to add each item fast. Descriptions are optional.'), list.el),
  };
  const btns = {};
  let style;
  const api = {
    count: () => (style === 'list' ? list.count() : quick.get()),
    /** What the server expects: a plain count, or the list of items. */
    value: () => (style === 'list' ? list.items() : quick.get()),
    onChange: (fn) => listeners.push(fn),
  };
  const changed = () => { const n = api.count(); listeners.forEach((fn) => fn(n)); };
  const setStyle = (s) => {
    style = s === 'list' ? 'list' : 'quick';
    store.set('donationStyle', style);
    for (const k of Object.keys(panels)) {
      panels[k].classList.toggle('hidden', k !== style);
      btns[k].className = k === style ? 'on' : '';
    }
    changed();
  };
  api.el = h('div', {},
    h('div', { class: 'tabs sub' },
      (btns.quick = h('button', { id: 'styleQuick', type: 'button', onclick: () => setStyle('quick') }, 'Quick count')),
      (btns.list = h('button', { id: 'styleList', type: 'button', onclick: () => setStyle('list') }, 'List items'))
    ),
    panels.quick, panels.list
  );
  quick.onChange(changed);
  list.onChange(changed);
  setStyle(store.get('donationStyle'));
  return api;
}

function newDonorTab(body) {
  const name = h('input', { id: 'newName', placeholder: 'First name + last initial', autocomplete: 'off' });
  const contact = h('input', { id: 'newContact', placeholder: 'Phone or email (optional, helps find them later)', autocomplete: 'off', inputmode: 'email' });
  const items = donationInput(0);
  const btn = h('button', { class: 'go full', id: 'registerBtn' });
  const label = (n) => { btn.textContent = n ? 'Register + give ' + plural(n, 'ticket') : 'Register (no tickets yet)'; };
  label(items.count());
  items.onChange(label);
  btn.addEventListener('click', () => busy(btn, async () => {
    await ensureServerUpToDate();
    const m = await call('createMember', state.pin, state.staff, name.value, contact.value, items.value(), '');
    toast(m.matchedExisting ? 'Already registered — added to ' + m.name : 'Registered ' + m.name);
    go({ m: m.code, fresh: '1' });
  }).finally(() => label(items.count())));
  body.append(
    h('div', { class: 'card' },
      h('h2', {}, 'New donor'),
      h('label', { for: 'newName' }, 'Name'), name,
      h('label', { for: 'newContact' }, 'Phone or email'), contact,
      h('label', {}, 'Items donated (1 item = 1 ticket)'), items.el,
      btn
    )
  );
  name.focus();
}

async function statsTab(body) {
  body.append(h('p', { class: 'muted center' }, 'Loading…'));
  try {
    const s = await call('getStats', state.pin);
    const stat = (n, l) => h('div', { class: 'stat' }, h('b', {}, n), h('span', { class: 'muted' }, l));
    body.replaceChildren(
      h('div', { class: 'card' },
        h('h2', {}, 'Totals'),
        h('div', { class: 'stats' },
          stat(s.people, 'people'), stat(s.outstanding, 'tickets unspent'),
          stat(s.issued, 'tickets given'), stat(s.redeemed, 'tickets spent')
        )
      ),
      h('div', { class: 'card' },
        h('h2', {}, 'Recent activity'),
        s.recent.length ? h('ul', { class: 'list' }, s.recent.map((e) =>
          h('li', { class: 'clickable' + (e.undone ? ' struck' : ''), onclick: () => go({ m: e.code }) },
            h('div', { class: 'grow' },
              h('div', { class: 'title' }, e.name + ' — ' + e.note),
              h('div', { class: 'muted' }, fmtTime(e.ts), e.staff ? ' · ' + e.staff : '')
            ),
            changeCell(e)
          ))) : h('p', { class: 'muted' }, 'Nothing yet.')
      )
    );
  } catch (e) { body.replaceChildren(h('div', { class: 'notice err' }, errMsg(e))); }
}

async function showStaffMember(code, flash) {
  render(h('p', { class: 'muted center' }, 'Loading…'));
  let m;
  try {
    m = await call('getMemberForStaff', state.pin, code);
  } catch (e) {
    const msg = errMsg(e);
    if (/PIN/.test(msg)) { state.pin = ''; store.set('pin', ''); updateHeader(); return showWallet(code); }
    return render(h('div', { class: 'notice err' }, msg), h('button', { class: 'full', onclick: () => go({}) }, 'Back'));
  }
  renderStaffMember(m, flash);
}

function renderStaffMember(m, flash) {
  // Donation: count or list the items dropped off (1 item = 1 ticket).
  const items = donationInput(1);
  const addBtn = h('button', { class: 'go full', id: 'addBtn' });
  const addLabel = (n) => {
    addBtn.textContent = n ? '+ Give ' + plural(n, 'ticket') : 'List the items to give tickets';
    addBtn.disabled = !n;
  };
  addLabel(items.count());
  items.onChange(addLabel);
  addBtn.addEventListener('click', () => busy(addBtn, async () => {
    const given = items.value();
    const n = Array.isArray(given) ? given.length : given;
    await ensureServerUpToDate();
    const updated = await call('addTickets', state.pin, state.staff, m.code, given, '');
    renderStaffMember(updated, { ok: 'Gave ' + plural(n, 'ticket') + '. New balance: ' + updated.balance });
  }).finally(() => addLabel(items.count())));

  // Shop: spend tickets on goods.
  const count = stepper(1, 1);
  const note = h('input', { id: 'note', placeholder: 'What they took (optional)', autocomplete: 'off' });
  const redeemBtn = h('button', { class: 'primary full', id: 'redeemBtn' });
  const spendLabel = (n) => {
    redeemBtn.textContent = '− Spend ' + plural(n, 'ticket');
    redeemBtn.disabled = n > m.balance;
  };
  spendLabel(count.get());
  count.onChange(spendLabel);
  redeemBtn.addEventListener('click', () => busy(redeemBtn, async () => {
    const n = count.get();
    const updated = await call('redeemTickets', state.pin, state.staff, m.code, n, note.value);
    renderStaffMember(updated, { ok: 'Spent ' + plural(n, 'ticket') + '. New balance: ' + updated.balance });
  }).finally(() => spendLabel(count.get())));

  const givePanel = h('div', {}, items.el, addBtn);
  const shopPanel = h('div', {},
    h('p', { class: 'muted' }, 'How many items are they taking?'),
    count.el, note, redeemBtn);
  const modeBtns = {};
  const setMode = (mode) => {
    state.mode = mode;
    givePanel.classList.toggle('hidden', mode !== 'give');
    shopPanel.classList.toggle('hidden', mode !== 'shop');
    for (const [k, b] of Object.entries(modeBtns)) b.className = k === mode ? 'on' : '';
  };
  const modeBar = h('div', { class: 'tabs' },
    (modeBtns.give = h('button', { id: 'modeGive', onclick: () => setMode('give') }, 'Donation')),
    (modeBtns.shop = h('button', { id: 'modeShop', onclick: () => setMode('shop') }, 'Shop'))
  );
  setMode(state.mode);

  const onUndo = (entry, btn) => {
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1';
      btn.textContent = 'Tap to confirm';
      setTimeout(() => { btn.dataset.armed = ''; btn.textContent = 'Undo'; }, 4000);
      return;
    }
    busy(btn, async () => {
      const updated = await call('undoEntry', state.pin, state.staff, entry.id);
      renderStaffMember(updated, { ok: 'Undone. New balance: ' + updated.balance });
    });
  };

  const qrCard = h('div', { class: 'card center' },
    h('h2', {}, 'Give them their ticket'),
    h('p', { class: 'muted' }, 'Have them scan this with their phone camera and bookmark the page — or write down the code.'),
    qrBox(m.code),
    h('div', { class: 'codebig' }, m.code)
  );
  const qrToggle = h('button', { class: 'full', onclick: () => { qrCard.classList.toggle('hidden'); } }, 'Show / hide their QR code');
  if (!(flash && flash.showQr)) qrCard.classList.add('hidden');

  render(
    flash && flash.ok ? h('div', { class: 'notice ok', id: 'flash' }, flash.ok) : null,
    h('div', { class: 'card' },
      h('div', { class: 'who' }, m.name),
      h('div', { class: 'center muted' }, h('span', { class: 'pill' }, m.code), m.contact ? ' ' + m.contact : ''),
      h('div', { class: 'balance' },
        h('div', { class: 'num', id: 'balance' }, m.balance),
        h('div', { class: 'lbl' }, m.balance === 1 ? 'ticket' : 'tickets')
      )
    ),
    h('div', { class: 'card' }, modeBar, givePanel, shopPanel),
    qrCard,
    qrToggle,
    historyCard(m.history, true, onUndo),
    h('button', { class: 'full', onclick: () => { state.tab = 'find'; go({}); } }, '← Back to search')
  );
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
(async function init() {
  state.pin = store.get('pin');
  state.staff = store.get('staff');
  document.getElementById('title').firstChild.textContent = CONFIG.eventName;
  document.title = CONFIG.eventName + ' Tickets';
  const params = () => Object.fromEntries(new URLSearchParams(location.search));
  window.addEventListener('popstate', () => route(params()));
  route(params());
})();
</script>
